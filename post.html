<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="description" content="Blog post" />
    <title>Ratul · Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="post">
    <div class="loader" id="loader" aria-hidden="true">
      <div class="loader-orbit"></div>
      <p class="loader-text">Loading</p>
      <div class="loader-bar"><span></span></div>
    </div>

    <canvas id="webgl" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grid-floor" aria-hidden="true"></div>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header is-scrolled" id="top">
      <nav class="nav glass" aria-label="Primary">
        <a class="nav-logo" href="index.html">
          <span class="nav-logo-mark" aria-hidden="true"></span>
          <span data-profile="name">Ratul</span>
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Open menu"
        >
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#work">Experience</a></li>
          <li><a href="index.html#projects">Projects</a></li>
          <li><a href="blog.html" data-nav-page="blog">Blog</a></li>
          <li><a href="resume.html" data-nav-page="resume">Resume</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="page-main">
      <div class="container post-wrap">
        <a class="post-back" href="blog.html">← All posts</a>

        <article class="post-article glass" id="post-article">
          <header class="post-header">
            <div class="post-meta" id="post-meta"></div>
            <h1 class="post-title" id="post-title"></h1>
            <ul class="blog-tags post-tags" id="post-tags"></ul>
          </header>
          <div class="post-body prose" id="post-body"></div>
        </article>

        <div class="post-not-found glass" id="post-not-found" hidden>
          <h1>Post not found</h1>
          <p>The article you’re looking for doesn’t exist or was moved.</p>
          <a class="btn btn-glow" href="blog.html">Back to blog</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <p>
          <span data-profile="name">Ratul</span>
          <span class="muted">·</span>
          <span id="footer-year"></span>
        </p>
        <a href="blog.html" class="footer-link">← Back to blog</a>
      </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="site.config.js"></script>
    <script src="common.js"></script>
    <script src="scene3d.js"></script>
    <script src="blog.js"></script>
  </body>
</html>
