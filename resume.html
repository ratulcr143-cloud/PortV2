<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Resume — experience, skills, and download." />
    <title>Ratul · Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="resume" data-scroll-crest="off">
    <div class="loader" id="loader" aria-hidden="true">
      <div class="loader-orbit"></div>
      <p class="loader-text">Loading</p>
      <div class="loader-bar"><span></span></div>
    </div>

    <canvas id="webgl" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grid-floor" aria-hidden="true"></div>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header is-scrolled" id="top">
      <nav class="nav glass" aria-label="Primary">
        <a class="nav-logo" href="index.html">
          <span class="nav-logo-mark" aria-hidden="true"></span>
          <span data-profile="name">Ratul</span>
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Open menu"
        >
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#work">Experience</a></li>
          <li><a href="index.html#projects">Projects</a></li>
          <li><a href="blog.html" data-nav-page="blog">Blog</a></li>
          <li><a href="resume.html" data-nav-page="resume">Resume</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="page-main">
      <header class="page-hero">
        <div class="container page-hero-inner page-hero-inner--wide">
          <p class="chip">CV</p>
          <h1 class="page-title">Resume</h1>
          <p class="page-lead" id="resume-intro">
            Download or view my latest resume below.
          </p>
          <div class="resume-actions" id="resume-actions">
            <a
              class="btn btn-glow magnetic"
              id="resume-download"
              href="assets/resume.pdf"
              download
            >
              <span>Download PDF</span>
            </a>
            <a
              class="btn btn-outline magnetic"
              id="resume-open"
              href="assets/resume.pdf"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span>Open in new tab</span>
            </a>
          </div>
          <p class="resume-updated" id="resume-updated" hidden></p>
        </div>
      </header>

      <section class="section section--resume" aria-label="Resume preview">
        <div class="container">
          <div class="resume-viewer glass" id="resume-viewer">
            <article
              class="resume-document"
              id="resume-document"
              aria-label="Resume"
              hidden
            ></article>
            <div
              class="resume-pdf-pages"
              id="resume-pdf-pages"
              hidden
              aria-label="Resume PDF pages"
            ></div>
            <iframe
              class="resume-frame"
              id="resume-frame"
              title="Resume PDF preview"
              hidden
            ></iframe>
            <object
              class="resume-object"
              id="resume-object"
              type="application/pdf"
              data=""
              hidden
              aria-label="Resume PDF preview"
            >
              <p class="resume-object-fallback">
                <a id="resume-object-link" href="assets/resume.pdf">Open resume PDF</a>
              </p>
            </object>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <p>
          <span data-profile="name">Ratul</span>
          <span class="muted">·</span>
          <span id="footer-year"></span>
        </p>
        <a href="index.html" class="footer-link">← Back to home</a>
      </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="site.config.js"></script>
    <script src="common.js"></script>
    <script src="scene3d.js"></script>
    <script src="resume.js"></script>
  </body>
</html>
